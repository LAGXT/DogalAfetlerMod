## Bağımlılıklar

junit_surum=5.11.4
# Modrinth maven: e4mc'nin sürüm numarası tekildir. Cold Sweat 2.4.5 numarası birden çok MC sürümünde
# tekrarlandığı için Forge 1.20.1 dosyasının Modrinth sürüm kimliği kullanılır (z3qJDJxm = ColdSweat-2.4.5, forge, 1.20.1).
# Etkinleştirmek için: ./gradlew runClient -Puyum=e4mc | coldsweat | ikisi
e4mc_surum=6.2.3-forge
coldsweat_surum=z3qJDJxm

