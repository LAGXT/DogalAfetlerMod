# Gradle JVM belleği; Minecraft decompile adımı en az 3 GB ister.
org.gradle.jvmargs=-Xmx3G
# Daemon kapalı kalır: her derleme bitince RAM boşalır (docs/GOREV.md §2).
org.gradle.daemon=false

## Ortam

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod
# Gradle bu dosyayı ISO-8859-1 okur: değerlerdeki Türkçe harfler \uXXXX kaçışıyla yazılır (yorumlar okunmaz).

mod_id=dogalafetler
mod_name=Do\u011fal Afetler
mod_license=MIT
mod_version=0.1.0
mod_group_id=io.github.kadirberkpolat1.dogalafetler
mod_authors=Kadir Berk Polat
mod_description=Minecraft 1.20.1 i\u00e7in ger\u00e7ek\u00e7i do\u011fal afetler, s\u0131cakl\u0131k sistemi ve d\u00fcnya d\u00f6nemleri.

## Bağımlılıklar

junit_surum=5.11.4
# Modrinth maven: e4mc'nin sürüm numarası tekildir. Cold Sweat 2.4.5 numarası birden çok MC sürümünde
# tekrarlandığı için Forge 1.20.1 dosyasının Modrinth sürüm kimliği kullanılır (z3qJDJxm = ColdSweat-2.4.5, forge, 1.20.1).
# Etkinleştirmek için: ./gradlew runClient -Puyum=e4mc | coldsweat | ikisi
e4mc_surum=6.2.3-forge
coldsweat_surum=z3qJDJxm

