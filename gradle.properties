# Gradle JVM belleği; Minecraft decompile adımı en az 3 GB ister.
org.gradle.jvmargs=-Xmx3G
# Bu dosya pc2 ile paylaşılır (8 GB): daemon burada kapalı kalır. Ana makinede ~/.gradle/gradle.properties
# org.gradle.daemon=true ile açıktır (kullanıcı dizinindeki ayar bu dosyayı ezer; K-E51, K-E19 rev.).
org.gradle.daemon=false
# Derleme önbelleği: aynı girdili görev çıktısı ~/.gradle/caches/build-cache-1'den gelir; --rerun-tasks yasak (K-E51).
org.gradle.caching=true

## Ortam

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

