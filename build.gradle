plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.23,8)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.x Java 25 ister (Mojang son kullanıcıya Java 25 dağıtır); JAVA_HOME'daki JDK 25 toolchain olarak bulunur.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            // Mixin yapılandırmaları komut satırından verilir (jar'da ise MixinConfigs manifest girdisinden okunur).
            args "--mixin.config=${mod_id}.su.mixins.json"
            args "--mixin.config=${mod_id}.client.su.mixins.json"
            args "--mixin.config=${mod_id}.uyum.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // Entegre sunucuda yaşam döngüsü sınama afeti (core.OyunTestiAfeti), ör. -PoyunTestiAfeti=deprem.
            if (project.hasProperty('oyunTestiAfeti')) {
                systemProperty 'dogalafetler.oyunTestiAfeti', project.property('oyunTestiAfeti').toString()
            }
            // Quick Play: -PquickPlay=<run/saves altındaki dünya klasörü>, ör. -PquickPlay=test
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            if (project.hasProperty('kullaniciAdi')) {
                args '--username', project.property('kullaniciAdi').toString()
            }
            if (project.hasProperty('quickPlaySunucu')) {
                args '--quickPlayMultiplayer', project.property('quickPlaySunucu').toString()
            }
            // İstemci otomasyonu (K0-21 rev. 2): -Potomasyon=su senaryoyu koşar, ekran görüntüsü alır, oyunu kapatır.
            if (project.hasProperty('otomasyon')) {
                systemProperty 'dogalafetler.otomasyon', project.property('otomasyon').toString()
                systemProperty 'dogalafetler.otomasyon.bolum', (project.findProperty('otomasyonBolum') ?: 'hepsi').toString()
                args '--width', '1280', '--height', '720'
            }
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('run-server')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('oyunTestiAfeti')) {
                systemProperty 'dogalafetler.oyunTestiAfeti', project.property('oyunTestiAfeti').toString()
            }
            args '--nogui'
        }

        // Kayıtlı bütün GameTest'leri koşar ve çıkar. -Ptest_filtre=<regex> yalnız uyan testleri koşar (K-E20).
        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('test_filtre')) {
                systemProperty 'dogalafetler.gametest.filtre', project.property('test_filtre').toString()
            }
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                    '--output', layout.projectDirectory.dir('src/generated/resources'),
                    '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

// runData çıktıları derlemeye dahil edilir.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Uyum API taslakları (JEI, Jade): derleme zamanında yalnız kullanılan imzaları taşıyan taslaklar (src/uyumApi/java) ana kaynak
// kümesinin derleme sınıf yoluna eklenir; jar'a ve çalışma sınıf yoluna girmez. Taslak imzaları 1.20.1 içindi, 26.x için yeniden
// doğrulanmalı.
sourceSets {
    uyumApi
}
sourceSets.uyumApi.compileClasspath = sourceSets.main.compileClasspath
sourceSets.main.compileClasspath += sourceSets.uyumApi.output

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:' + eventbus_validator_version
    // Sanal su mixin'leri (gerekçe docs/KARARLAR.md K0-25): işlemci derlemede mixin doğrular.
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    testImplementation platform("org.junit:junit-bom:${junit_surum}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Çalışma klasörleri git'te değil; yeni bir klon ya da worktree'de ilk açılışta gereken dosyalar burada yazılır.
tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
    doFirst {
        def klasor = project.file('run-server')
        klasor.mkdirs()
        def eula = new File(klasor, 'eula.txt')
        if (!eula.exists()) {
            eula.text = 'eula=true\n'
        }
        def ozellikler = new File(klasor, 'server.properties')
        if (!ozellikler.exists()) {
            ozellikler.text = "online-mode=false\nlevel-name=test\nlevel-seed=${test_dunyasi_seed}\n"
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // GameTest sunucusu dünyayı server.properties'ten kurar: yapısız düz dünya (K0-31), her koşuda boş (K-E16).
        def ozellikler = project.file('run-gametest/server.properties')
        ozellikler.parentFile.mkdirs()
        def yonetilen = [
                'level-type'        : 'flat',
                'level-name'        : 'oyuntesti-duz',
                'generate-structures': 'false',
                'generator-settings': '{"layers":[{"block":"minecraft:bedrock","height":1},' +
                        '{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],' +
                        '"biome":"minecraft:plains","structure_overrides":[]}',
        ]
        def eski = ozellikler.exists() ? ozellikler.readLines() : []
        def satirlar = eski.findAll { satir -> !yonetilen.keySet().any { satir.startsWith(it + '=') } }
        yonetilen.each { anahtar, deger -> satirlar << "${anahtar}=${deger}".toString() }
        ozellikler.text = satirlar.join('\n') + '\n'
        project.delete(project.file('run-gametest/oyuntesti-duz'))
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        def klasor = project.file('run')
        klasor.mkdirs()
        def secenekler = new File(klasor, 'options.txt')
        if (!secenekler.exists()) {
            secenekler.text = 'pauseOnLostFocus:false\n'
        } else if (!secenekler.readLines().contains('pauseOnLostFocus:false')) {
            def satirlar = secenekler.readLines().findAll { !it.startsWith('pauseOnLostFocus:') }
            satirlar << 'pauseOnLostFocus:false'
            secenekler.text = satirlar.join('\n') + '\n'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_display_url: mod_display_url, mod_issue_url: mod_issue_url,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // Mixin üretim jar'ında yapılandırmaları buradan bulur.
                'MixinConfigs'            : "${mod_id}.su.mixins.json,${mod_id}.client.su.mixins.json,${mod_id}.uyum.mixins.json",
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
