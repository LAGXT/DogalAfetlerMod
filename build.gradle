plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 Java 17 ister; JAVA_HOME'daki JDK 17 toolchain olarak bulunur.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// Uyumluluk modları: -Puyum=e4mc | coldsweat | ikisi (varsayılan: yok).
def uyum = (project.findProperty('uyum') ?: 'yok').toString()
if (!(uyum in ['yok', 'e4mc', 'coldsweat', 'ikisi'])) {
    throw new GradleException("Geçersiz -Puyum=${uyum}; geçerli değerler: yok, e4mc, coldsweat, ikisi")
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // Entegre sunucuda yaşam döngüsü sınama afeti (core.OyunTestiAfeti), ör. -PoyunTestiAfeti=deprem.
            if (project.hasProperty('oyunTestiAfeti')) {
                property 'dogalafetler.oyunTestiAfeti', project.property('oyunTestiAfeti').toString()
            }
            // Quick Play: -PquickPlay=<run/saves altındaki dünya klasörü>, ör. -PquickPlay=test
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // Çok oyunculu/ekran otomasyonu: -PkullaniciAdi=A (oyuncu adı), -PquickPlaySunucu=localhost:25565 (doğrudan giriş).
            if (project.hasProperty('kullaniciAdi')) {
                args '--username', project.property('kullaniciAdi').toString()
            }
            if (project.hasProperty('quickPlaySunucu')) {
                args '--quickPlayMultiplayer', project.property('quickPlaySunucu').toString()
            }
            // İstemci otomasyonu (K0-21 rev. 2): -Potomasyon=su senaryoyu koşar, ekran görüntüsü alır, oyunu kapatır.
            if (project.hasProperty('otomasyon')) {
                property 'dogalafetler.otomasyon', project.property('otomasyon').toString()
                property 'dogalafetler.otomasyon.bolum', (project.findProperty('otomasyonBolum') ?: 'hepsi').toString()
                args '--width', '1280', '--height', '720'
            }
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            // Yaşam döngüsünü gerçek afet olmadan sınamak için: -PoyunTestiAfeti=deprem,sinkhole (core.OyunTestiAfeti).
            if (project.hasProperty('oyunTestiAfeti')) {
                property 'dogalafetler.oyunTestiAfeti', project.property('oyunTestiAfeti').toString()
            }
            args '--nogui'
        }

        // Kayıtlı bütün GameTest'leri koşar ve çıkar; hiç GameTest yoksa çöker.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// runData çıktıları derlemeye dahil edilir.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Modrinth deposu yalnız maven.modrinth grubunu sunar. exclusiveContent kullanılmaz: fg.deobf aynı gruptaki
    // *_mapped_official yapıtını ForgeGradle'ın kendi deobf deposundan verir ve exclusiveContent bunu engeller.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    if (uyum == 'e4mc' || uyum == 'ikisi') {
        runtimeOnly fg.deobf("maven.modrinth:e4mc:${e4mc_surum}")
    }
    if (uyum == 'coldsweat' || uyum == 'ikisi') {
        runtimeOnly fg.deobf("maven.modrinth:cold-sweat:${coldsweat_surum}")
    }

    testImplementation platform("org.junit:junit-bom:${junit_surum}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Çalışma klasörleri git'te değil; yeni bir klon ya da worktree'de ilk açılışta gereken dosyalar burada yazılır.
tasks.matching { it.name == 'runServer' }.configureEach {
    // Sunucu konsolu: Gradle'ın stdin'i sunucuya iletilir, böylece `stop` ve diğer komutlar yazılabilir.
    standardInput = System.in
    doFirst {
        def klasor = project.file('run-server')
        klasor.mkdirs()
        def eula = new File(klasor, 'eula.txt')
        if (!eula.exists()) {
            eula.text = 'eula=true\n'
        }
        def ozellikler = new File(klasor, 'server.properties')
        if (!ozellikler.exists()) {
            ozellikler.text = "online-mode=false\nlevel-name=test\nlevel-seed=${test_dunyasi_seed}\n"
        }
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // Forge'un GameTest sunucusu dünyayı server.properties'ten kurar (yoksa log'a yanıltıcı bir ERROR düşer). Normal
        // arazi testlerin sahnesini örter (K0-31): yapısız düz dünya, eski dünyaya dokunmamak için ayrı klasörde. Yönetilen
        // anahtarlar her koşuda yeniden yazılır; dosyadaki diğer satırlar korunur. Oyun kuralları kural.OyunTestiDunyasi'nda.
        def ozellikler = project.file('run-gametest/server.properties')
        ozellikler.parentFile.mkdirs()
        def yonetilen = [
                'level-type'        : 'flat',
                'level-name'        : 'oyuntesti-duz',
                'generate-structures': 'false',
                'generator-settings': '{"layers":[{"block":"minecraft:bedrock","height":1},' +
                        '{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],' +
                        '"biome":"minecraft:plains","structure_overrides":[]}',
        ]
        def eski = ozellikler.exists() ? ozellikler.readLines() : []
        def satirlar = eski.findAll { satir -> !yonetilen.keySet().any { satir.startsWith(it + '=') } }
        yonetilen.each { anahtar, deger -> satirlar << "${anahtar}=${deger}".toString() }
        ozellikler.text = satirlar.join('\n') + '\n'
        yonetilen.each { anahtar, deger -> logger.lifecycle("run-gametest/server.properties: ${anahtar}=${deger}") }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    doFirst {
        def klasor = project.file('run')
        klasor.mkdirs()
        def secenekler = new File(klasor, 'options.txt')
        if (!secenekler.exists()) {
            secenekler.text = 'pauseOnLostFocus:false\n'
        } else if (!secenekler.readLines().contains('pauseOnLostFocus:false')) {
            def satirlar = secenekler.readLines().findAll { !it.startsWith('pauseOnLostFocus:') }
            satirlar << 'pauseOnLostFocus:false'
            secenekler.text = satirlar.join('\n') + '\n'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
